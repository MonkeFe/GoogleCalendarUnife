[project]
name = "googlecalendarunife"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicola Tieghi", email = "nicola.tieghi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httplib2>=0.32.1",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
googlecalendarunife = "googlecalendarunife:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
